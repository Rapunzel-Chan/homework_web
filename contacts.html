<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная</title>
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    nav {
      background-color: #0d6efd !important;
    }
    .nav-link {
      color: #fff !important;
    }
    .nav-link.active {
      background-color: #000 !important;
      color: #fff !important;
    }
    .container {
      display: flex;
      align-items: flex-start; /* Выравнивание по верхнему краю */
    }
    .form-container {
      flex: 1;
      margin-right: 20px; /* Отступ между блоками */
    }
    .info-container {
      flex: 1;
      margin-top: 30px; /* Отступ сверху, чтобы блок с контактами был ниже */
    }
    .email-input {
      position: relative;
    }
    .email-input::before {
      content: '@';
      position: absolute;
      left: 10px; /* Отступ от левого края */
      top: 50%;
      transform: translateY(-50%);
      color: gray; /* Цвет значка */
      font-size: 18px; /* Размер значка */
    }
    .email-field {
      padding-left: 30px; /* Отступ для текста, чтобы не перекрывался значком */
    }

  </style>
</head>
<body>
  <div class="d-flex">
    <nav class="text-white p-3 d-flex flex-column vh-100" style="width: 250px;">
      <h5 class="text-white mb-4">
        <i class="bi bi-bootstrap-fill me-2"></i>Меню
      </h5>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a href="index.html" class="nav-link d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
              class="me-2" viewBox="0 0 16 16">
              <path d="M7.293 1.5a1 1 0 0 1 1.414 0L11 3.793V2.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v3.293l2.354 2.353a.5.5 0 0 1-.708.707L8 2.207 1.354
                       8.853a.5.5 0 1 1-.708-.707z"/>
              <path d="m14 9.293-6-6-6 6V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0
                       1.5-1.5zm-6-.811c1.664-1.673 5.825 1.254 0
                       5.018-5.825-3.764-1.664-6.691 0-5.018"/>
            </svg>
            Главная
          </a>
        </li>
        <li class="nav-item">
          <a href="catalogue.html" class="nav-link">
            <i class="bi bi-card-list me-2"></i> Каталог
          </a>
        </li>
        <li class="nav-item">
          <a href="categories.html" class="nav-link">
            <i class="bi bi-grid me-2"></i> Категории
          </a>
        </li>
        <li class="nav-item">
          <a href="contacts.html" class="nav-link">
            <i class="bi bi-telephone me-2"></i> Контакты
          </a>
        </li>
      </ul>

      <div class="mt-auto">
        <div class="dropdown">
          <a class="btn btn-secondary dropdown-toggle w-100 d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-2"></i> Пользователь
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Профиль</a></li>
            <li><a class="dropdown-item" href="#">Выход</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container-fluid p-4">
     <h2 class="text-center mb-4">Контактные данные</h2>
     <div class="container mt-5">
      <div class="form-container">
        <form method="POST" class="mt-4">
          <div class="mb-3">
            <label for="name" class="form-label">Ваше имя</label>
            <input type="text" class="form-control" id="name" name="name" required placeholder="Введите ваше имя">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="Введите ваш email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Сообщение</label>
            <textarea class="form-control" id="message" name="message" rows="3" required placeholder="Введите ваше сообщение"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
      </div>

      <!-- Добавлен отступ для блока с контактами -->
      <div class="info-container">
        <h3>Наши контакты:</h3>
        <p>Адрес: г. Москва, ул. Питонов, 42</p>
        <p>Телефон: +7 903 234 345 6</p>
        <p>Email: moscow_pythons@gmail.com</p>
      </div>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const currentPage = window.location.pathname.split("/").pop();
    const navLinks = document.querySelectorAll(".nav-link");

    navLinks.forEach(link => {
      const linkPage = link.getAttribute("href");
      if (linkPage === currentPage) {
        link.classList.add("active");
      }
    });
  </script>
</body>
</html>
